services:
  sandbox-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bilitool_sandbox
      POSTGRES_USER: bilitool_sandbox
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:?set SANDBOX_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilitool_sandbox -d bilitool_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sandbox-postgres:/var/lib/postgresql/data

  sandbox-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Sandbox
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSQL: Host=sandbox-db;Port=5432;Database=bilitool_sandbox;Username=bilitool_sandbox;Password=${SANDBOX_DB_PASSWORD}
      ApiSettings__EnableLegacyApiKeys: "false"
      ApiSettings__BootstrapClient__TenantCode: sandbox-hospital
      ApiSettings__BootstrapClient__TenantName: Sandbox Hospital
      ApiSettings__BootstrapClient__ClientCode: sandbox-his
      ApiSettings__BootstrapClient__DisplayName: Sandbox HIS Client
      ApiSettings__BootstrapClient__ApiKey: ${SANDBOX_API_KEY:?set SANDBOX_API_KEY}
      ApiSettings__BootstrapClient__Scopes: bilirubin:calculate bilirubin:metadata
      Operations__HisRateLimitPermit: "10000"
      Operations__HisRateLimitWindowSeconds: "60"
      HisRollout__EmergencyKillSwitch: ${SANDBOX_EMERGENCY_KILL_SWITCH:-false}
    depends_on:
      sandbox-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  sandbox-postgres:
